name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todoAppBackEnd/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn test
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: "**/surefire-reports/*.xml"
          reporter: java-junit
